name: bsf_scale
description: 精简版体脂秤连接软件（蚂蚁阿福 AFU），Flutter 跨端 Android + Windows。
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_reactive_ble: ^5.0.3   # 跨端 BLE（Android BLE Core / Windows WinRT BLE）
  drift: ^2.20.0                 # 本地 SQLite（跨端，Room 的精神继承者）
  drift_flutter: ^2.20.0
  path_provider: ^2.1.3
  path: ^1.9.0
  flutter_riverpod: ^2.5.1       # 状态管理
  dynamic_color: ^1.7.0         # Android 动态主题色（monet）
  permission_handler: ^11.3.1   # Android 9–11 定位权限 / 12+ 蓝牙权限
  material_color_utilities: ^0.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
