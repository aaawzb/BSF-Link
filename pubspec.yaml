name: bsf_scale
description: 精简版体脂秤连接软件（蚂蚁阿福 AFU），Flutter 跨端 Android + Windows。
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'   # drift 2.34 线要求 Dart >=3.10（Flutter >= 3.24）

dependencies:
  flutter:
    sdk: flutter
  flutter_blue_plus: ^1.35.1   # 跨端 BLE（Android/iOS/macOS/Linux/Web + Windows 经已背书伴侣包 winrt 自动包含）
  drift: ^2.34.0                 # 本地 SQLite（跨端，Room 的精神继承者）
  drift_flutter: ^0.3.1          # drift 的 Flutter 集成（版本独立，非 2.x）
  path_provider: ^2.1.3
  path: ^1.9.0
  flutter_riverpod: ^2.5.1       # 状态管理
  dynamic_color: ^1.7.0         # Android 动态主题色（monet）；其传递依赖自行管理 material_color_utilities
  permission_handler: ^11.3.1   # Android 9–11 定位权限 / 12+ 蓝牙权限

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.34.0
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
