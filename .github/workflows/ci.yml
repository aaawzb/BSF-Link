name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      # ─── 1. 检出 + Flutter 环境 ───
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses > /dev/null 2>&1 || true

      # ─── 2. 生成安卓原生壳（仅 android，跳过 windows） ───
      - name: Generate Android shell
        run: |
          cp -r lib /tmp/app_lib
          cp pubspec.yaml /tmp/app_pubspec.yaml
          cp analysis_options.yaml /tmp/app_analysis_options.yaml
          flutter create --platforms=android .
          rm -rf lib && cp -r /tmp/app_lib lib
          cp /tmp/app_pubspec.yaml pubspec.yaml
          cp /tmp/app_analysis_options.yaml analysis_options.yaml

      # ─── 3. 修补 Android 构建配置 ───
      # compileSdk=35（满足 reactive_ble 等依赖的 ≥34 要求）
      # minSdk=28（项目目标 Android 9+）
      # AndroidManifest 注入蓝牙 5 权限
      - name: Patch Android build config
        run: |
          python3 - <<'PY'
          import re

          # 3a. AndroidManifest 注入蓝牙/定位权限
          man = "android/app/src/main/AndroidManifest.xml"
          s = open(man, encoding="utf-8").read()
          if "BLUETOOTH_SCAN" not in s:
              s = s.replace(
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android"\n'
                  '    xmlns:tools="http://schemas.android.com/tools">',
                  1,
              )
              perms = (
                  '    <uses-permission android:name="android.permission.BLUETOOTH"/>\n'
                  '    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN"/>\n'
                  '    <uses-permission android:name="android.permission.BLUETOOTH_SCAN" '
                  'android:usesPermissionFlags="neverForLocation"/>\n'
                  '    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT"/>\n'
                  '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" '
                  'android:maxSdkVersion="30"/>\n'
              )
              s = s.replace("    <application", perms + "    <application", 1)
              open(man, "w", encoding="utf-8").write(s)
              print("AndroidManifest: BLE permissions injected")

          # 3b. build.gradle.kts: compileSdk=35, minSdk=28
          gradle = "android/app/build.gradle.kts"
          g = open(gradle, encoding="utf-8").read()

          g = re.sub(
              r"compileSdk\s*=\s*flutter\.compileSdkVersion",
              "compileSdk = 35",
              g,
          )
          g = re.sub(r"compileSdk\s*=\s*\d+", "compileSdk = 35", g)
          g = re.sub(r"minSdk\s*=\s*flutter\.minSdkVersion", "minSdk = 28", g)
          g = re.sub(r"minSdk\s*=\s*\d+", "minSdk = 28", g)

          open(gradle, "w", encoding="utf-8").write(g)
          print("app/build.gradle.kts: compileSdk=35, minSdk=28")

          # 3c. 根工程脚本强制所有模块(含插件) compileSdk=35
          # 关键: AAR 元数据校验报错的是插件模块(:reactive_ble_mobile 等),
          # 它们用 flutter.compileSdkVersion(3.44 默认 33)。仅改 app 模块不够,
          # 必须用 subprojects 在 afterEvaluate 阶段覆盖全部模块的 compileSdk。
          root = "android/build.gradle.kts"
          r = open(root, encoding="utf-8").read()
          block = """
subprojects {
    afterEvaluate {
        val lib = extensions.findByType(com.android.build.api.dsl.LibraryExtension::class.java)
        if (lib != null) { lib.compileSdk = 35 }
        val app = extensions.findByType(com.android.build.api.dsl.ApplicationExtension::class.java)
        if (app != null) { app.compileSdk = 35 }
    }
}
"""
          if "compileSdk = 35" not in r:
              # 避免重复追加; 只在文件无 subprojects 覆盖时写入
              if "subprojects {" not in r:
                  open(root, "a", encoding="utf-8").write(block)
                  print("root/build.gradle.kts: subprojects compileSdk=35 appended")
              else:
                  print("root/build.gradle.kts: subprojects already present, skip")
          else:
              print("root/build.gradle.kts: compileSdk=35 already present, skip")
          PY

      # ─── 4. 依赖 + 静态分析 ───
      - name: Install dependencies
        run: flutter pub get | tee pubget.txt

      - name: Analyze
        continue-on-error: true
        run: flutter analyze | tee analyze.txt

      # ─── 5. 编译 Android Debug APK ───
      - name: Build debug APK
        run: |
          flutter build apk --debug 2>&1 | tee build.txt
          echo "BUILD_EXIT=${PIPESTATUS[0]}" >> build.txt
          APK="build/app/outputs/flutter-apk/app-debug.apk"
          if [ -f "$APK" ]; then
            echo "APK SIZE: $(du -h "$APK" | cut -f1)" >> build.txt
          else
            echo "APK NOT FOUND" >> build.txt
          fi

      # ─── 6. 上传产物 ───
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-output
          path: |
            pubget.txt
            analyze.txt
            build.txt
            build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: ignore

      # ─── 7. 写入 CI 报告到 issue #1 ───
      - name: Report to issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create ci-report --color "0E8A16" 2>/dev/null || true
          {
            echo "# CI Report — commit ${{ github.sha }}"
            echo ""
            echo "## flutter analyze"
            echo '```'
            tail -n 8 analyze.txt 2>/dev/null || echo "(not captured)"
            echo '```'
            echo ""
            echo "## flutter build apk"
            echo '```'
            tail -n 60 build.txt 2>/dev/null || echo "(not captured)"
            echo '```'
          } > report.md
          NUM=$(gh issue list --label ci-report --limit 1 --json number -q '.[0].number')
          if [ -z "$NUM" ]; then
            gh issue create --title "CI auto-report" --body-file report.md --label ci-report
          else
            gh issue edit "$NUM" --body-file report.md
          fi
