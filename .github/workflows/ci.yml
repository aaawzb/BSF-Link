name: Build & Pre-release

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

# 预发布需要创建 tag + release，故需要 contents: write。
permissions:
  contents: write
  issues: write

jobs:
  # ───────────────────────── Android ─────────────────────────
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses > /dev/null 2>&1 || true

      - name: Ensure Android SDK platform 36
        run: |
          SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SM" ] || SM="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SM" ]; then
            yes | "$SM" "platforms;android-36" >/dev/null 2>&1 || true
            echo "ensured platforms;android-36"
          else
            echo "sdkmanager not found; relying on preinstalled platforms"
          fi

      - name: Generate Android shell
        run: |
          cp -r lib /tmp/app_lib
          cp pubspec.yaml /tmp/app_pubspec.yaml
          cp analysis_options.yaml /tmp/app_analysis_options.yaml
          flutter create --platforms=android .
          rm -rf lib && cp -r /tmp/app_lib lib
          cp /tmp/app_pubspec.yaml pubspec.yaml
          cp /tmp/app_analysis_options.yaml analysis_options.yaml

      # 修补 Android 构建配置：
      #  - AndroidManifest 注入蓝牙/定位权限
      #  - compileSdk=36（flutter_blue_plus_android 7.0.4 要求 >=36）
      #  - minSdk=28（Android 9+）
      #  - 关键：用根工程 subprojects 强制"所有模块(含插件)"compileSdk=36，
      #    否则插件模块各自用 flutter.compileSdkVersion 会令 AAR 校验失败。
      - name: Patch Android build config
        run: |
          python3 - <<'PY'
          import re
          import textwrap

          man = "android/app/src/main/AndroidManifest.xml"
          s = open(man, encoding="utf-8").read()
          if "BLUETOOTH_SCAN" not in s:
              s = s.replace(
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android"\n'
                  '    xmlns:tools="http://schemas.android.com/tools">',
                  1,
              )
              perms = (
                  '    <uses-permission android:name="android.permission.BLUETOOTH"/>\n'
                  '    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN"/>\n'
                  '    <uses-permission android:name="android.permission.BLUETOOTH_SCAN" '
                  'android:usesPermissionFlags="neverForLocation"/>\n'
                  '    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT"/>\n'
                  '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" '
                  'android:maxSdkVersion="30"/>\n'
              )
              s = s.replace("    <application", perms + "    <application", 1)
              open(man, "w", encoding="utf-8").write(s)
              print("AndroidManifest: BLE permissions injected")

          gradle = "android/app/build.gradle.kts"
          g = open(gradle, encoding="utf-8").read()
          g = re.sub(r"compileSdk\s*=\s*flutter\.compileSdkVersion", "compileSdk = 36", g)
          g = re.sub(r"compileSdk\s*=\s*\d+", "compileSdk = 36", g)
          g = re.sub(r"minSdk\s*=\s*flutter\.minSdkVersion", "minSdk = 28", g)
          g = re.sub(r"minSdk\s*=\s*\d+", "minSdk = 28", g)
          open(gradle, "w", encoding="utf-8").write(g)
          print("app/build.gradle.kts: compileSdk=36, minSdk=28")

          # 根工程脚本：强制所有模块(含插件) compileSdk=36
          root = "android/build.gradle.kts"
          r = open(root, encoding="utf-8").read()
          if "subprojects {" not in r:
              block = textwrap.dedent(
                  """
                  subprojects {
                      afterEvaluate {
                          val lib = extensions.findByType(com.android.build.api.dsl.LibraryExtension::class.java)
                          if (lib != null) { lib.compileSdk = 36 }
                          val app = extensions.findByType(com.android.build.api.dsl.ApplicationExtension::class.java)
                          if (app != null) { app.compileSdk = 36 }
                      }
                  }
                  """
              )
              open(root, "a", encoding="utf-8").write(block)
              print("root/build.gradle.kts: subprojects compileSdk=36 appended")
          else:
              print("root/build.gradle.kts: subprojects already present, skip")
          PY

      - name: Install dependencies
        run: flutter pub get | tee pubget.txt

      - name: Analyze
        continue-on-error: true
        run: flutter analyze | tee analyze.txt

      - name: Build debug APK
        run: |
          flutter build apk --debug 2>&1 | tee build.txt
          echo "BUILD_EXIT=${PIPESTATUS[0]}" >> build.txt
          APK="build/app/outputs/flutter-apk/app-debug.apk"
          if [ -f "$APK" ]; then
            echo "APK SIZE: $(du -h "$APK" | cut -f1)" >> build.txt
          else
            echo "APK NOT FOUND" >> build.txt
          fi

      - name: Upload Android artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            pubget.txt
            analyze.txt
            build.txt
            build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: ignore

  # ───────────────────────── Windows ─────────────────────────
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Generate Windows shell
        shell: bash
        run: |
          cp -r lib /tmp/app_lib
          cp pubspec.yaml /tmp/app_pubspec.yaml
          cp analysis_options.yaml /tmp/app_analysis_options.yaml
          flutter create --platforms=windows .
          rm -rf lib && cp -r /tmp/app_lib lib
          cp /tmp/app_pubspec.yaml pubspec.yaml
          cp /tmp/app_analysis_options.yaml analysis_options.yaml

      - name: Patch Windows build config
        shell: bash
        run: |
          f="windows/CMakeLists.txt"
          [ -f "$f" ] || { echo "$f not found, skip"; exit 0; }
          if grep -q "_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS" "$f"; then
            echo "silence macro already present, skip"
            exit 0
          fi
          tmp="$f.new"
          awk '
            { print }
            /^project\(/ && !done {
              print ""
              print "# Suppress MSVC <experimental/coroutine> deprecation hard-error (permission_handler_windows etc.)."
              print "set(CMAKE_CXX_FLAGS \"${CMAKE_CXX_FLAGS} /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS\")"
              done=1
            }
          ' "$f" > "$tmp" && mv "$tmp" "$f"
          echo "injected silence macro into $f"

      - name: Install dependencies
        shell: bash
        run: flutter pub get | tee pubget.txt

      - name: Analyze
        continue-on-error: true
        shell: bash
        run: flutter analyze | tee analyze.txt

      - name: Build Windows
        shell: bash
        run: |
          flutter build windows 2>&1 | tee build.txt
          echo "BUILD_EXIT=${PIPESTATUS[0]}" >> build.txt
          EXE="build/windows/x64/runner/Release/bsf_scale.exe"
          if [ -f "$EXE" ]; then
            echo "EXE SIZE: $(du -h "$EXE" | cut -f1)" >> build.txt
            tar -a -cf windows-build.zip -C build/windows/x64/runner/Release .
          else
            echo "EXE NOT FOUND" >> build.txt
          fi

      - name: Upload Windows artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            pubget.txt
            analyze.txt
            build.txt
            windows-build.zip
          if-no-files-found: ignore

  # ───────────────────────── Pre-release ─────────────────────────
  release:
    name: Publish Pre-release
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="pre-${{ github.run_number }}-${{ github.sha }}"
          ASSETS=()
          if [ -f "artifacts/android-apk/app-debug.apk" ]; then
            ASSETS+=("artifacts/android-apk/app-debug.apk#BSF-Link-Android.apk")
          fi
          if [ -f "artifacts/windows-build/windows-build.zip" ]; then
            ASSETS+=("artifacts/windows-build/windows-build.zip#BSF-Link-Windows.zip")
          fi
          if [ ${#ASSETS[@]} -eq 0 ]; then
            echo "No build artifacts produced; skip release."
            exit 0
          fi
          gh release create "$TAG" --prerelease \
            --title "Pre-release #${{ github.run_number }}" \
            --notes "Automated pre-release from commit ${{ github.sha }}." \
            "${ASSETS[@]}"
