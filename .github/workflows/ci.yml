name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  build:
    name: Build APK + analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses > /dev/null 2>&1 || true

      - name: Generate native shells (keep our lib/pubspec)
        run: |
          cp -r lib /tmp/app_lib
          cp pubspec.yaml /tmp/app_pubspec.yaml
          flutter create --platforms=android,windows --overwrite .
          rm -rf lib && cp -r /tmp/app_lib lib
          cp /tmp/app_pubspec.yaml pubspec.yaml

      - name: Install dependencies
        # 即使 pub get 失败也继续，确保后续报告能产出真实错误
        run: flutter pub get > pubget.txt 2>&1 || true

      - name: Analyze
        run: flutter analyze > analyze.txt 2>&1 || true

      - name: Build APK (debug)
        run: flutter build apk --debug > build.txt 2>&1 || true

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: ignore

      - name: Report results to issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "# CI Report — commit ${{ github.sha }}"
            echo "## flutter pub get"
            cat pubget.txt 2>/dev/null || echo "（pub get 未捕获输出）"
            echo ""
            echo "## flutter analyze"
            cat analyze.txt 2>/dev/null || echo "（analyze 未生成）"
            echo ""
            echo "## flutter build apk"
            cat build.txt 2>/dev/null || echo "（build 未生成）"
          } > report.md
          NUM=$(gh issue list --label ci-report --limit 1 --json number -q '.[0].number')
          if [ -z "$NUM" ]; then
            gh issue create --title "CI auto-report" --body-file report.md --label ci-report
          else
            gh issue edit "$NUM" --body-file report.md
          fi
